<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; background:#fff; font-family:'TH Sarabun New','Sarabun',sans-serif; }
  svg  { display:block; }
</style>
</head>
<body>
<svg width="860" height="1230" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 z" fill="#455a64"/>
  </marker>
  <marker id="arr-w" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L0,7 L9,3.5 z" fill="#455a64"/>
  </marker>
</defs>

<!-- ══════════════════════════════════════════════════
     TITLE
══════════════════════════════════════════════════ -->
<text x="430" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a237e">แผนภาพแสดงลำดับการทำงานของระบบ SeismoGuard</text>
<text x="430" y="40" text-anchor="middle" font-size="13" fill="#546e7a">STA/LTA Recursive P-wave Detector — Arduino Uno + MPU6050</text>

<!-- ══════════════════════════════════════════════════
     HELPER GROUPS (one shape per block, then text)
══════════════════════════════════════════════════ -->

<!-- 1. START  cx=430 cy=74  w=200 h=38 -->
<rect x="330" y="55" width="200" height="38" rx="19" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
<text x="430" y="79" text-anchor="middle" dominant-baseline="middle" font-size="16" font-weight="bold" fill="#fff">เริ่มต้น (Start)</text>

<!-- arrow 1→2 -->
<line x1="430" y1="93" x2="430" y2="110" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- 2. INITIALIZE  top=112 h=60 -->
<rect x="200" y="112" width="460" height="60" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="430" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">ตั้งค่าเริ่มต้น (Initialize)</text>
<text x="430" y="152" text-anchor="middle" font-size="13" fill="#37474f">MPU6050: 50 Hz, DLPF 10 Hz, range ±2g</text>
<text x="430" y="167" text-anchor="middle" font-size="13" fill="#37474f">STA = 0,  LTA = 0,  state = STANDBY,  count = 0</text>

<!-- arrow 2→3 -->
<line x1="430" y1="172" x2="430" y2="190" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- 3. BOOTSTRAP  top=192 h=46 -->
<rect x="200" y="192" width="460" height="46" rx="5" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5"/>
<text x="430" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">Bootstrap LTA (รอ 6 วินาที)</text>
<text x="430" y="228" text-anchor="middle" font-size="13" fill="#37474f">สะสม 300 samples เพื่อให้ LTA มีค่าเสถียรก่อนเริ่มตรวจจับ</text>

<!-- arrow 3→4  +  "วนซ้ำ" label -->
<line x1="430" y1="238" x2="430" y2="258" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="438" y="252" font-size="12" fill="#1565c0" font-style="italic">— วนซ้ำทุก 20 ms (50 Hz) —</text>

<!-- ─────────── LOOP TOP = y=260 ─────────── -->

<!-- 4. READ SENSOR  top=260 h=46 -->
<rect x="200" y="260" width="460" height="46" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="430" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">อ่านค่าความเร่งจาก MPU6050</text>
<text x="430" y="296" text-anchor="middle" font-size="13" fill="#37474f">a_z ← Z-axis (แกนดิ่ง)  @ 50 Hz</text>

<!-- arrow 4→5 -->
<line x1="430" y1="306" x2="430" y2="324" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- 5. COMPUTE CF  top=326 h=46 -->
<rect x="200" y="326" width="460" height="46" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="430" y="345" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">คำนวณ Characteristic Function (CF)</text>
<text x="430" y="362" text-anchor="middle" font-size="13" fill="#37474f">CF = ( a_z − mean_z )²</text>

<!-- arrow 5→6 -->
<line x1="430" y1="372" x2="430" y2="390" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- 6. SPIKE REJECTION  top=392 h=46 -->
<rect x="200" y="392" width="460" height="46" rx="5" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5"/>
<text x="430" y="411" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">Spike Rejection</text>
<text x="430" y="428" text-anchor="middle" font-size="13" fill="#37474f">ถ้า CF > 100 × LTA  →  ตัด CF = 100 × LTA</text>

<!-- arrow 6→7 -->
<line x1="430" y1="438" x2="430" y2="456" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- 7. UPDATE STA  top=458 h=60 -->
<rect x="200" y="458" width="460" height="60" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="430" y="477" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">อัปเดต STA  (EMA, τ = 0.5 s)</text>
<text x="430" y="494" text-anchor="middle" font-size="13" fill="#37474f">α_STA = 1 − exp(−Δt / 0.5)</text>
<text x="430" y="510" text-anchor="middle" font-size="13" fill="#37474f">STA ← α_STA × CF + (1 − α_STA) × STA</text>

<!-- arrow 7→8 -->
<line x1="430" y1="518" x2="430" y2="534" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ══════════════════════════════════════════════════
     8. DECISION: STANDBY?
     Diamond: cx=430 cy=560
     left(268,560)  right(592,560)  top(430,534)  bottom(430,586)
══════════════════════════════════════════════════ -->
<polygon points="430,534 592,560 430,586 268,560" fill="#fce4ec" stroke="#880e4f" stroke-width="1.5"/>
<text x="430" y="557" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d1b2a">สถานะ = STANDBY ?</text>
<text x="430" y="573" text-anchor="middle" font-size="12" fill="#37474f">(LTA อัปเดตเฉพาะตอน STANDBY)</text>

<!-- YES branch: right(592,560) → Update LTA box -->
<line x1="592" y1="560" x2="638" y2="560" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="596" y="553" font-size="13" font-weight="bold" fill="#2e7d32">ใช่</text>

<!-- Update LTA box: x=640 y=536 w=130 h=48 cy=560 -->
<rect x="640" y="536" width="140" height="48" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="710" y="556" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d1b2a">อัปเดต LTA</text>
<text x="710" y="572" text-anchor="middle" font-size="12" fill="#37474f">(EMA, τ = 30 s)</text>

<!-- LTA box → directly into right side of Compute Ratio: bottom(710,584) → down to y=639 → left to x=662 -->
<line x1="710" y1="584" x2="710" y2="639" stroke="#455a64" stroke-width="1.8"/>
<line x1="710" y1="639" x2="662" y2="639" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- NO branch: bottom(430,586) → down into top of Compute Ratio -->
<line x1="430" y1="586" x2="430" y2="616" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="436" y="604" font-size="13" font-weight="bold" fill="#c62828">ไม่ใช่</text>

<!-- ══════════════════════════════════════════════════
     9. COMPUTE RATIO  top=616 h=46
══════════════════════════════════════════════════ -->
<rect x="200" y="616" width="460" height="46" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="430" y="635" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">คำนวณ Ratio = STA / LTA</text>
<text x="430" y="652" text-anchor="middle" font-size="13" fill="#37474f">เปรียบเทียบกับ RATIO threshold = 5.0</text>

<!-- arrow 9→10 -->
<line x1="430" y1="662" x2="430" y2="678" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ══════════════════════════════════════════════════
     10. DECISION: Ratio > 5.0 ?
     Diamond: cx=430 cy=704
     left(268,704)  right(592,704)  top(430,678)  bottom(430,730)
══════════════════════════════════════════════════ -->
<polygon points="430,678 592,704 430,730 268,704" fill="#fce4ec" stroke="#880e4f" stroke-width="1.5"/>
<text x="430" y="700" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d1b2a">Ratio > 5.0 ?</text>
<text x="430" y="717" text-anchor="middle" font-size="12" fill="#37474f">STA/LTA เกิน threshold</text>

<!-- NO branch: left(268,704) → x=100 → up to y=283 → right into left side of Read box -->
<line x1="268" y1="704" x2="100" y2="704" stroke="#455a64" stroke-width="1.8"/>
<line x1="100" y1="704" x2="100" y2="283" stroke="#455a64" stroke-width="1.8"/>
<line x1="100" y1="283" x2="198" y2="283" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="230" y="698" font-size="13" font-weight="bold" fill="#c62828">ไม่ใช่</text>
<text x="82" y="510" font-size="12" fill="#37474f" transform="rotate(-90,82,510)">reset count = 0, วนกลับ</text>

<!-- YES branch: bottom(430,730) → down -->
<line x1="430" y1="730" x2="430" y2="750" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="436" y="744" font-size="13" font-weight="bold" fill="#2e7d32">ใช่</text>

<!-- ══════════════════════════════════════════════════
     11. INCREMENT COUNT  top=752 h=46
══════════════════════════════════════════════════ -->
<rect x="200" y="752" width="460" height="46" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
<text x="430" y="771" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">count = count + 1</text>
<text x="430" y="788" text-anchor="middle" font-size="13" fill="#37474f">นับตัวอย่างที่ ratio เกิน threshold ต่อเนื่อง</text>

<!-- arrow 11→12 -->
<line x1="430" y1="798" x2="430" y2="816" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ══════════════════════════════════════════════════
     12. DECISION: count >= 10 ?
     Diamond: cx=430 cy=842
     left(268,842)  right(592,842)  top(430,816)  bottom(430,868)
══════════════════════════════════════════════════ -->
<polygon points="430,816 592,842 430,868 268,842" fill="#fce4ec" stroke="#880e4f" stroke-width="1.5"/>
<text x="430" y="838" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d1b2a">count ≥ 10 ?</text>
<text x="430" y="856" text-anchor="middle" font-size="12" fill="#37474f">ตัวอย่างต่อเนื่อง ≥ 10 (≈ 200 ms)</text>

<!-- NO branch: left(268,842) → far left x=65 → up to y=283 → right to x=100 (merge with ratio loop) -->
<line x1="268" y1="842" x2="65" y2="842" stroke="#455a64" stroke-width="1.8"/>
<line x1="65" y1="842" x2="65" y2="283" stroke="#455a64" stroke-width="1.8"/>
<line x1="65" y1="283" x2="100" y2="283" stroke="#455a64" stroke-width="1.8"/>
<text x="224" y="836" font-size="13" font-weight="bold" fill="#c62828">ไม่</text>

<!-- YES branch: bottom(430,868) → down -->
<line x1="430" y1="868" x2="430" y2="888" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="436" y="882" font-size="13" font-weight="bold" fill="#2e7d32">ใช่</text>

<!-- ══════════════════════════════════════════════════
     STATE: DETECTING  top=890 h=42
══════════════════════════════════════════════════ -->
<rect x="215" y="890" width="430" height="42" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
<text x="430" y="905" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">สถานะ: DETECTING</text>
<text x="430" y="922" text-anchor="middle" font-size="13" fill="#37474f">ตรวจพบ P-wave — กำลังยืนยันความต่อเนื่อง</text>

<!-- arrow → ALARMING -->
<line x1="430" y1="932" x2="430" y2="950" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ══════════════════════════════════════════════════
     STATE: ALARMING  top=952 h=58
══════════════════════════════════════════════════ -->
<rect x="195" y="952" width="470" height="58" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="430" y="972" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">⚠  สถานะ: ALARMING</text>
<text x="430" y="989" text-anchor="middle" font-size="13" fill="#37474f">เปิด Buzzer + LED แจ้งเตือนผู้ใช้</text>
<text x="430" y="1004" text-anchor="middle" font-size="13" fill="#37474f">ตรวจจับ P-wave สำเร็จ — เข้าสู่ช่วง Lockout</text>

<!-- arrow → LOCKOUT -->
<line x1="430" y1="1010" x2="430" y2="1028" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ══════════════════════════════════════════════════
     STATE: LOCKOUT  top=1030 h=48
══════════════════════════════════════════════════ -->
<rect x="215" y="1030" width="430" height="48" rx="5" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="430" y="1049" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">สถานะ: LOCKOUT</text>
<text x="430" y="1066" text-anchor="middle" font-size="13" fill="#37474f">หยุดนับ + LTA หยุดอัปเดต เพื่อป้องกัน alarm ซ้ำ</text>

<!-- arrow → STANDBY -->
<line x1="430" y1="1078" x2="430" y2="1096" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ══════════════════════════════════════════════════
     STATE: STANDBY  top=1098 h=44
══════════════════════════════════════════════════ -->
<rect x="215" y="1098" width="430" height="44" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="430" y="1115" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d1b2a">สถานะ: STANDBY</text>
<text x="430" y="1132" text-anchor="middle" font-size="13" fill="#37474f">reset count = 0, LTA กลับมาอัปเดต, รอสัญญาณใหม่</text>

<!-- Loop back: bottom(430,1142) → right to x=810 → up to y=283 → left into right edge of Read sensor box -->
<line x1="430" y1="1142" x2="430" y2="1158" stroke="#455a64" stroke-width="1.8"/>
<line x1="430" y1="1158" x2="810" y2="1158" stroke="#455a64" stroke-width="1.8"/>
<line x1="810" y1="1158" x2="810" y2="283" stroke="#455a64" stroke-width="1.8"/>
<line x1="810" y1="283" x2="662" y2="283" stroke="#455a64" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="822" y="720" font-size="12" fill="#2e7d32" font-style="italic" transform="rotate(-90,822,720)">วนกลับ → อ่านค่าใหม่</text>

<!-- ══════════════════════════════════════════════════
     LEGEND
══════════════════════════════════════════════════ -->
<rect x="20" y="1172" width="820" height="48" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>

<rect x="34"  y="1186" width="14" height="12" rx="2" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
<text x="54"  y="1196" font-size="12.5" fill="#37474f">กระบวนการหลัก</text>

<rect x="158" y="1186" width="14" height="12" rx="2" fill="#fff8e1" stroke="#f57f17" stroke-width="1"/>
<text x="178" y="1196" font-size="12.5" fill="#37474f">กระบวนการพิเศษ / Bootstrap</text>

<rect x="340" y="1186" width="14" height="12" rx="2" fill="#fce4ec" stroke="#880e4f" stroke-width="1"/>
<text x="360" y="1196" font-size="12.5" fill="#37474f">การตัดสินใจ</text>

<rect x="460" y="1186" width="14" height="12" rx="2" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<text x="480" y="1196" font-size="12.5" fill="#37474f">ALARMING</text>

<rect x="560" y="1186" width="14" height="12" rx="2" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<text x="580" y="1196" font-size="12.5" fill="#37474f">LOCKOUT</text>

<rect x="650" y="1186" width="14" height="12" rx="2" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="670" y="1196" font-size="12.5" fill="#37474f">STANDBY / DETECTING</text>

<!-- second legend row -->
<rect x="34"  y="1202" width="14" height="12" rx="2" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
<text x="54"  y="1212" font-size="12.5" fill="#37474f">จุดเริ่มต้น</text>

<text x="178" y="1212" font-size="12.5" fill="#37474f">→  YES = ใช่  (เขียว)     ✕  NO = ไม่ใช่  (แดง)</text>

</svg>
</body>
</html>
